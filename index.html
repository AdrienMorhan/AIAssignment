<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <title>Snake Game</title>
    <style>
        canvas {
            border: 3px solid black;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
            background-color: greenyellow;
        }

        .pause-button {
            text-align: center;
            font-size: 10px;
            color: white;
            background-color: red;
            padding: 15px 25px;
            width: 125px;
            border: 2px solid black;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            cursor: pointer;
            font-family: "Press Start 2P", monospace;
        }

        #info {
            text-align: center;
            font-size: 24px;
            font-family: "Press Start 2P", monospace;
        }
    </style>
</head>
<body>

    <h1>Snake</h1>
    <div class="score">
        <div class="counter">
            <h4>Score:</h4>
            <h4 id="count">0</h4>
        </div>
        <div class="best">
            <h4>Best:</h4>
            <h4 id="bestScore">0</h4>
        </div>
    </div>
    <canvas id="gameCanvas" width="400"
            height="400"></canvas>
    <p id="info"></p>

    <script>
        // ===== GAME SETUP =====
        const canvas =
            document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        // ===== INITIAL STATE =====
        let snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];
        
        let direction = { x: 1, y: 0 };
        let food = { x: 15, y: 15 };
        let interval;
        let score = 0;
        let best = localStorage.getItem("best") || 0;
        let canChangeDirection = true;
        let moveDelay = 200;

        // ===== DRAWING =====
        const drawGame = () => {
            ctx.clearRect(0, 0,
                canvas.width, canvas.height);

            ctx.fillStyle = "red";
            ctx.fillRect(
                food.x * gridSize,
                food.y * gridSize,
                gridSize, gridSize
            );

            ctx.fillStyle = "green";
            snake.forEach((segment, index) => {
                if (index===0){
                    let radius;
                    ctx.beginPath();
                    if (direction.x===1){
                        radius = [0, 20, 20, 0];
                    } else if (direction.x===-1){
                        radius = [20, 0, 0, 20];
                    } else if (direction.y===1){
                        radius = [0, 0, 20, 20];
                    } else {
                        radius = [20, 20, 0, 0];
                    }
                    ctx.roundRect(segment.x*gridSize, segment.y*gridSize, gridSize, gridSize, radius);
                    ctx.fill();
                } else {
                    ctx.fillRect(
                        segment.x * gridSize,
                        segment.y * gridSize,
                        gridSize, gridSize
                    );
                }
            });
        };

        drawGame();

        // ===================================
        // BUILD THE GAME FROM HERE
        // ===================================
        //
        // Use your custom agent in VS Code Chat 
        // to guide your work through each step. 
        // Commit regularly.
        //
        // Step 1: Movement (game loop)
        // Step 2: Keyboard controls (arrow keys)
        // Step 3: Eating and growing
        // Step 4: Game over
        // Step 5: Improvements
        //
        // ===================================

        /**
         * This function:
         * - moves the snake
         * - increase the score when the food is eaten
         * - increase the speed of the snake
         * - ends game if the snake touch the border or himself
         */
        function moveSnake() {
            if (!gameOver()){
                snake.pop();
                snake.unshift({x: snake[0].x+direction.x, y: snake[0].y+direction.y});
                if (snake[0].x === food.x && snake[0].y === food.y) {
                    score++;
                    snake.push({x: snake[snake.length-1].x+direction.x, y: snake[snake.length-1].y+direction.y})
                    document.getElementById("count").textContent = score.toString();
                    if (score%3===1){
                        clearInterval(interval);
                        moveDelay -= 10;
                        interval = setInterval(moveSnake, moveDelay);
                    }
                    let outSnake = false;
                    while (!outSnake){
                        food = {
                            x: Math.floor((Math.random()*gridSize)),
                            y: Math.floor((Math.random()*gridSize))
                        } 
                        outSnake = true;
                        for (let i = 0; i < snake.length; i++){
                            if (snake[i].x===food.x && snake[i].y===food.y){
                                outSnake = false;
                                break;
                            }
                        }
                    }
                }     
            }
            canChangeDirection = true;
            drawGame();
        }

        /**
         * This function check if the game is over or not.
         * It also increase the best score if needed
         */
        function gameOver(){
            let end = false;
            if (snake[0].x+direction.x < 0 || snake[0].x+direction.x > gridSize-1 || snake[0].y+direction.y < 0 || snake[0].y+direction.y > gridSize-1){
                clearInterval(interval);
                end = true;
                document.getElementById("info").textContent = "Game Over!";
                buttonPause.textContent="Restart";
                buttonPause.style.backgroundColor = "blue";
                if (best<score){
                    best = score;
                    localStorage.setItem("best", best);
                }
            } else {
                for (let i = 2; i<snake.length; i++) {
                    if (snake[0].x===snake[i].x && snake[0].y===snake[i].y){
                        clearInterval(interval);
                        end = true;
                        document.getElementById("info").textContent = "Game Over!";
                        buttonPause.textContent="Restart";
                        buttonPause.style.backgroundColor = "blue";
                        if (best<score){
                            best = score;
                            localStorage.setItem("best", best);
                        }
                    }
                }
            }
            return end;
        }

        // set an interval between each movement of the snake
        interval = setInterval(moveSnake, 200);

        // Detect the pressed arrow and determine the direction according to it
        document.addEventListener("keydown", (event) => {
            switch(event.key){
                case 'ArrowUp':
                    if (direction.y !== 1 && canChangeDirection){
                        canChangeDirection = false; // Avoid the possibility to go upward and then backward if we press really fast a sided arrow
                        direction = { x: 0, y: -1 };
                    }
                    break;
                case 'ArrowDown':
                    if (direction.y !== -1 && canChangeDirection){
                        canChangeDirection = false;
                        direction = { x: 0, y: 1 };
                    }
                    break;
                case 'ArrowLeft':
                    if (direction.x !== 1 && canChangeDirection){
                        canChangeDirection = false;
                        direction = { x: -1, y: 0 };
                    }
                    break;
                case 'ArrowRight': 
                    if (direction.x !== -1 && canChangeDirection){
                        canChangeDirection = false;
                        direction = { x: 1, y: 0 };
                    }
                    break;
            }
        });

        // reset all variable to the beggining state
        function restartGame(){
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            
            direction = { x: 1, y: 0 };
            food = { x: 15, y: 15 };
            score = 0;
            document.getElementById("count").textContent = score.toString();
            canChangeDirection = true;
            moveDelay = 200;
            buttonPause.textContent="Pause";
            buttonPause.style.backgroundColor = "red";
            document.getElementById("info").textContent = "";
            interval = setInterval(moveSnake, moveDelay);
            drawGame();
        }

        // Button to pause, resume and restart the game
        var buttonPause = document.createElement("button");
        buttonPause.textContent="Pause";

        buttonPause.addEventListener("click", (event)=>{

            if (buttonPause.textContent==="Pause"){
                clearInterval(interval);
                buttonPause.textContent="Resume";
                buttonPause.style.backgroundColor = "green";

            } else if (buttonPause.textContent==="Resume") {
                interval = setInterval(moveSnake, moveDelay);
                buttonPause.textContent="Pause";
                buttonPause.style.backgroundColor = "red";

            } else {
                restartGame();
            }
        });
        buttonPause.className = "pause-button";
        document.body.appendChild(buttonPause);
    </script>

</body>
</html>
